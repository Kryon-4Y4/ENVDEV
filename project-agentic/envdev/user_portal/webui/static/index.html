<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENVDEV ChatBot</title>
  <style>
    /* 最简聊天页样式 */
    body { font-family: -apple-system, sans-serif; background: #f5f5f7; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 14px; text-align: center; font-weight: 600; border-bottom: 1px solid #e5e5ea; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; max-width: 720px; width: 100%; margin: 0 auto; }
    .msg { margin: 8px 0; padding: 10px 14px; border-radius: 14px; max-width: 75%; white-space: pre-wrap; word-break: break-word; }
    .user { background: #007aff; color: #fff; margin-left: auto; }
    .assistant { background: #fff; border: 1px solid #e5e5ea; }
    form { display: flex; gap: 8px; padding: 12px; max-width: 720px; width: 100%; margin: 0 auto; box-sizing: border-box; }
    input { flex: 1; padding: 10px 14px; border: 1px solid #d1d1d6; border-radius: 10px; font-size: 15px; }
    button { padding: 10px 20px; border: none; border-radius: 10px; background: #007aff; color: #fff; font-size: 15px; cursor: pointer; }
    button:disabled { background: #99c2f2; }
  </style>
</head>
<body>
  <header>ENVDEV ChatBot（前后端分离版）</header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="输入消息，回车发送…">
    <button id="send">发送</button>
  </form>

  <script>
    // 对话历史：前端维护，每次随请求发给后端（多轮记忆）
    const history = [];
    // 后端 API 地址：前后端分离，跨端口调用需绝对地址（后端已开 CORS 放行）
    // 用 location.hostname 推导，兼容 127.0.0.1 / localhost 两种访问方式；/stream 为 SSE 流式端点
    const API_URL = `http://${location.hostname}:8000/api/chat/stream`;
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    // 追加一条消息气泡
    function append(role, content) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = content;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;  // 滚动到底部
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      input.value = "";
      send.disabled = true;
      append("user", message);

      // 先挂一个空的 assistant 气泡，流式内容逐块填进去（打字机效果）
      const bubble = document.createElement("div");
      bubble.className = "msg assistant";
      chat.appendChild(bubble);

      try {
        // 调后端流式 API（SSE）：带上本轮消息 + 历史
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history }),
        });
        if (!res.ok) throw new Error("后端错误 HTTP " + res.status);

        // 流式读取：ReadableStream 逐块读 → 按 SSE 的 \n\n 切分 → 增量渲染
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let full = "", buffer = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          // 注意：一次 read 拿到的字节与消息边界不对齐，需缓冲切分
          const parts = buffer.split("\n\n");
          buffer = parts.pop();  // 最后一段可能不完整，留到下一轮
          for (const p of parts) {
            if (!p.startsWith("data: ")) continue;
            const data = p.slice(6);
            if (data === "[DONE]") break;
            full += JSON.parse(data).content;
            bubble.textContent = full;
            chat.scrollTop = chat.scrollHeight;
          }
        }

        // 防御：只有收到非空回复才存历史（避免空 assistant 消息污染历史）
        if (full) {
          history.push({ role: "user", content: message });
          history.push({ role: "assistant", content: full });
        } else {
          bubble.remove();
        }
      } catch (err) {
        bubble.remove();
        append("assistant", "请求失败：" + err);
      } finally {
        send.disabled = false;
        input.focus();
      }
    };
  </script>
</body>
</html>
