# 构建系统配置 —— 使用 setuptools 进行项目打包
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# 项目元信息
[project]
name = "envdev"                     # 项目名
version = "0.1.0"                  # 版本号
description = "Agentic AI 学习项目 —— 参照 awesome-agentic-ai-zh 独立开发实践"
readme = "README.md"
requires-python = ">=3.11"          # 最低 Python 版本
dependencies = [
    # 基础
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    # LLM 客户端（DeepSeek 的 OpenAI 兼容接口）
    "openai>=1.0",
    # Web UI（最简聊天界面）
    "gradio>=4.0",
    # 前后端分离：后端 API 框架 + ASGI 服务器
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

# 可选依赖组 —— 按需安装
[project.optional-dependencies]
dev = [
    # 开发工具
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ipython>=8.0",
]
agent = [
    # Agent 框架（Stage 3-4 可选）
    # "openai>=1.0",
    # "anthropic>=0.30",
    # "langchain>=0.3",
]
rag = [
    # RAG 相关（Stage 6 可选）
    # "chromadb>=0.5",
    # "sentence-transformers>=3.0",
]

# 告诉 setuptools 包源码就在当前目录（扁平布局，无 src/）
[tool.setuptools.packages.find]
where = ["."]

# Pytest 配置
[tool.pytest.ini_options]
testpaths = ["tests"]               # 测试目录
python_files = ["test_*.py"]         # 测试文件命名规则